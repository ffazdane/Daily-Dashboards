name: Daily market dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
      timezone: America/Chicago
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate and archive today's report
        run: |
          python3 scripts/daily.py
          git add reports index.html
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Archive daily dashboard"
            git push origin HEAD:main
          fi
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          files = sorted(Path("reports").glob("FazDane_Daily_Market_Dashboard_????-??-??.html"))
          if not files:
              raise SystemExit("No dated FazDane HTML available")
          latest = files[-1]
          html = latest.read_text(encoding="utf-8")
          class LogoCheck(HTMLParser):
              found = False
              def handle_starttag(self, tag, attrs):
                  if tag == "img":
                      a = dict(attrs)
                      self.found |= ("fazdane" in a.get("alt","").lower()
                                     and (a.get("src","").startswith("data:image/")
                                          or "fazdane-logo.svg" in a.get("src","")))
          checker = LogoCheck()
          checker.feed(html)
          if not checker.found:
              raise SystemExit(f"{latest}: missing official FazDane logo image")
          if "disclaimer" not in html.lower():
              raise SystemExit(f"{latest}: missing financial disclaimer")
          print(f"Validated FazDane logo and disclaimer in {latest}")
          PY
          mkdir -p public/reports
          cp -r assets index.html .nojekyll public/
          cp reports/*.html public/reports/
          if [ -d weekly-breadth ]; then cp -r weekly-breadth public/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public files and post links
        env:
          BASE: ${{ steps.deploy.outputs.page_url }}
        run: |
          report=$(ls reports/FazDane_Daily_Market_Dashboard_????-??-??.html | sort | tail -1)
          for path in index.html "$report"; do
            curl -fsSL --retry 5 --retry-all-errors "${BASE%/}/$path?run=$GITHUB_RUN_ID" -o /tmp/live
            cmp "$path" /tmp/live
            echo "- [$path](${BASE%/}/$path)" >> "$GITHUB_STEP_SUMMARY"
          done
