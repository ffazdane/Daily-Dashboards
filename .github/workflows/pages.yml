name: Daily market dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
      timezone: America/Chicago
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate and archive today's report
        run: |
          python3 scripts/daily.py
          git add reports index.html
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Archive daily dashboard"
            git push origin HEAD:main
          fi
          mkdir -p public/reports
          cp -r assets index.html .nojekyll public/
          cp reports/*.html public/reports/
          if [ -d weekly-breadth ]; then cp -r weekly-breadth public/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public files and post links
        env:
          BASE: ${{ steps.deploy.outputs.page_url }}
        run: |
          report=$(ls reports/FazDane_Daily_Market_Dashboard_????-??-??.html | sort | tail -1)
          for path in index.html "$report"; do
            curl -fsSL --retry 5 --retry-all-errors "${BASE%/}/$path?run=$GITHUB_RUN_ID" -o /tmp/live
            cmp "$path" /tmp/live
            echo "- [$path](${BASE%/}/$path)" >> "$GITHUB_STEP_SUMMARY"
          done
