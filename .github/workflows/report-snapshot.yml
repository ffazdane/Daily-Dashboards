name: Render dashboard PNG snapshots
on:
  push:
    branches: [main]
    paths:
      - 'reports/*.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install browser renderer
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install chromium
      - name: Render the latest HTML dashboard as one full-page PNG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          files = sorted(Path("reports").glob("FazDane_Daily_Market_Dashboard_????-??-??.html"))
          assert files, "No dated dashboards found"
          target = files[-1]
          png = target.with_suffix(".png")
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--no-sandbox"])
              page = browser.new_page(viewport={"width":1080,"height":2050}, device_scale_factor=1, reduced_motion="reduce")
              page.goto(target.resolve().as_uri(), wait_until="load")
              page.screenshot(path=str(png), full_page=True, animations="disabled")
              browser.close()
          assert png.exists() and png.stat().st_size > 10000, "PNG capture failed"
          print(f"Created {png} ({png.stat().st_size} bytes)")
          PY
      - name: Commit generated PNG
        run: |
          git add reports/*.png
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Generate PNG snapshot for latest FazDane dashboard"
            git push origin HEAD:main
          fi
